name: pkyt
options:
  bundleIdPrefix: com.patrickkidd
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8KJB799CU7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.10
targets:
  pkyt:
    type: application
    platform: iOS
    sources: [pkyt]
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickkidd.pkyt
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: pkyt/Info.plist
      properties:
        CFBundleDisplayName: pkyt
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.patrickkidd.pkyt
            CFBundleURLSchemes: [pkyt]
  pkytTests:
    type: bundle.unit-test
    platform: iOS
    sources: [pkytTests]
    dependencies:
      - target: pkyt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickkidd.pkytTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  pkyt:
    build:
      targets:
        pkyt: all
        pkytTests: [test]
    test:
      targets: [pkytTests]
